name: Cleanup PR caches

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete caches for the merged ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          ids=$(gh cache list --ref "$BRANCH" --limit 100 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "No caches for $BRANCH"
            exit 0
          fi
          set +e
          for id in $ids; do
            gh cache delete "$id"
          done
