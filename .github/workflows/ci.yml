name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "*"
    tags:
      - "*"

concurrency:
  # One run per pull request, the newest one. A push that supersedes another
  # used to leave both running: fifteen jobs each, and the older one only
  # reported a verdict nobody was waiting for. Pushes to a branch keep their
  # run - every commit that lands there is meant to be validated.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOPROXY: https://proxy.golang.org,direct
  GO111MODULE: on
  # The number of bulk lanes in the race matrix, read by the lanes themselves
  # and checked against the matrix by the static job.
  RACE_SHARDS: "2"
  tf_version: "1.3.0"
  tf_init_cli_options: "-input=false"
  tf_validation_cli_options: ""
  tf_plan_cli_options: "-lock=false -input=false"
  tf_apply_cli_options: "-auto-approve -input=false"

jobs:
  # Formatting, tidiness and generated files once per run. The detector is the
  # only job that builds and tests, so these would otherwise not run at all.
  static:
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
    runs-on: ubuntu-latest
    # gofmt, tidy and generate take 84s warm. Without a bound a wedged generator
    # holds a runner for the default six hours.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/XDPoSChain
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          path: ${{ env.GOPATH }}/src/XDPoSChain
      # Cache build tools to avoid downloading them each time
      - uses: actions/cache@v5
        with:
          path: ${{ env.GOPATH }}/src/XDPoSChain/build/cache
          key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('**/build/checksums.txt') }}
      # `go generate ./...` compiles stringer, gencodec, abigen and
      # protoc-gen-go before it can run any of them, and without a build cache
      # that was 75s of this job on every push.
      - name: Restore the Go build cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-static-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-static-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-build-static-
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version: "1.25.x"
      - name: Check gofmt
        run: |
          unformatted=$(git ls-files '*.go' | xargs -r gofmt -s -l)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are properly formatted."
      - name: Check go mod tidy
        run: |
          set -euo pipefail
          go mod tidy -diff 2>&1 | sed '/^go: downloading/d'
          echo "go.mod and go.sum are tidy."
      - name: Validate generated files
        run: |
          go run build/ci.go generate
      # The bulk lanes are numbered by hand, so the count is read back from the
      # workflow: a lane dropped without the total moving would leave its
      # packages out of every lane, silently. A stale pin and an empty slice are
      # caught here too, in seconds instead of in a lane that timed out.
      - name: Check the shard split
        run: make check-shards RACE_SHARDS=$RACE_SHARDS

  # A diff with no Go code in it cannot introduce a race, and a CI or docs pull
  # request should not wait a couple of minutes for the detector. The build files are
  # the exception: they decide which packages the lanes run, so a change to the
  # split has to be exercised here or it is only verified by the next pull
  # request that happens to touch Go. Decide once here and let every lane read
  # the answer: fetching the base commit costs a second, while a full-history
  # checkout in each of the twelve lanes does not.
  race-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: diff
        name: Check the diff for Go code
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch or a force push has no base to compare against: run
          # the detector rather than guess.
          if [ -z "$base" ] || ! git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only FETCH_HEAD HEAD -- '*.go' 'go.mod' 'go.sum' 'Makefile' 'build' '.github/workflows' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no Go changes since $base"
          fi

  # The full suite under the race detector (#2700), and the only job that runs
  # the tests: the non-race shards it replaces covered the same packages with one
  # exception, core/vm/privacy, which has no lane here either (#2895) and is
  # unused. The lanes are cut by measured -race time, not by position: by
  # position, engine_v2_tests (624s), core/vm/privacy (328s) and core (308s)
  # landed in the same slice and made a 479s job that set the run's wall clock.
  # engine_v2_tests and core run as test-name slices of their own - engine_v2 in
  # five, because 624s of tests in three lanes left the slowest at 234s and it
  # set the run's wall clock again; core in two - and cmd/XDC in two, because at
  # 79s it is one package that no split of the tree can move. rpc stands alone
  # because its 32 MiB websocket test trips the codec's 30s pong timeout under
  # -p 4. Skipping the long cases saved 26% of the detector's time and hid the
  # races they cover, so the carve-out is gone. The bulk slices are derived from
  # the import path (build/shard.sh), so a new package lands in one of them and
  # does not shift the boundary the split was measured against.
  race:
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
    runs-on: ubuntu-latest
    name: race (${{ matrix.name }})
    needs: race-scope
    # `race-scope` answers whether there is Go code to test. The refs that
    # deploy are tested regardless: the jobs that build and push wait for this
    # one, and a skipped dependency skips them too.
    if: needs.race-scope.outputs.run == 'true' || github.ref == 'refs/heads/dev-upgrade' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        # `kind` picks the step. `shard` is the index into RACE_REST_PKGS, split
        # by import path (build/shard.sh); `pkg`/`i`/`n` are the enumeration
        # slice of a heavy package (see race-test-full-group).
        include:
          - { name: "bulk 1/2", kind: "bulk", shard: "1" }
          - { name: "bulk 2/2", kind: "bulk", shard: "2" }
          - { name: "engine_v2 1/5", kind: "group", pkg: "./consensus/tests/engine_v2_tests", i: "1", n: "5" }
          - { name: "engine_v2 2/5", kind: "group", pkg: "./consensus/tests/engine_v2_tests", i: "2", n: "5" }
          - { name: "engine_v2 3/5", kind: "group", pkg: "./consensus/tests/engine_v2_tests", i: "3", n: "5" }
          - { name: "engine_v2 4/5", kind: "group", pkg: "./consensus/tests/engine_v2_tests", i: "4", n: "5" }
          - { name: "engine_v2 5/5", kind: "group", pkg: "./consensus/tests/engine_v2_tests", i: "5", n: "5" }
          - { name: "core 1/2", kind: "group", pkg: "./core", i: "1", n: "2" }
          - { name: "core 2/2", kind: "group", pkg: "./core", i: "2", n: "2" }
          - { name: "cmd XDC 1/2", kind: "group", pkg: "./cmd/XDC", i: "1", n: "2" }
          - { name: "cmd XDC 2/2", kind: "group", pkg: "./cmd/XDC", i: "2", n: "2" }
          - { name: "rpc", kind: "rpc" }
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/XDPoSChain
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          path: ${{ env.GOPATH }}/src/XDPoSChain
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version: "1.25.x"
      # 660 MB unpacked, 156 MB stored of 10 GB; test results are cached here
      # too, which is why the commit belongs in the key.
      - name: Restore the Go build cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-race-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-build-race-${{ strategy.job-index }}-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-build-race-${{ strategy.job-index }}-
            ${{ runner.os }}-go-build-race-
      # Hang guards, not budgets: a warm lane runs two minutes, and one
      # subscription test once ran to go test's own 45m timeout. The lanes also
      # pass -timeout 10m (4m for rpc), below the watchdog, so a hung test
      # panics with a stack dump instead of being killed silently.
      - name: Run a slice of the tree under the race detector
        if: matrix.kind == 'bulk'
        timeout-minutes: 12
        run: make race-test-full-bulk RACE_SHARD=${{ matrix.shard }} RACE_SHARDS=${{ env.RACE_SHARDS }}
      - name: Run a slice of a heavy package under the race detector
        if: matrix.kind == 'group'
        timeout-minutes: 12
        run: make race-test-full-group GROUP_PKG=${{ matrix.pkg }} GROUP_I=${{ matrix.i }} GROUP_N=${{ matrix.n }}
      # rpc alone, the same watchdog in miniature.
      - name: Run the rpc package under the race detector
        if: matrix.kind == 'rpc'
        timeout-minutes: 5
        run: make race-test-full-rpc

  # Runs the linters (build/ci.go lint, golangci-lint version pinned in
  # build/checksums.txt) on every push and pull request. Deliberately not wired
  # into tag_build or devnet_build_push: a lint finding should not hold up a
  # release or deployment the way a race does.
  lint:
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
    runs-on: ubuntu-latest
    # 102s warm; the bound is for a linter that wedges, not for the work.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/XDPoSChain
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          path: ${{ env.GOPATH }}/src/XDPoSChain
      # Same tools cache as the static job: holds the golangci-lint archive that
      # build/ci.go lint unpacks from the URL recorded in build/checksums.txt.
      - uses: actions/cache@v5
        with:
          path: ${{ env.GOPATH }}/src/XDPoSChain/build/cache
          key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('**/build/checksums.txt') }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version: "1.25.x"
      - name: Run linter
        run: go run build/ci.go lint

  # tag_build waits for the detector; devnet_build_push fires on every merge.
  tag_build:
    runs-on: ubuntu-latest
    needs: [race, static]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT=${GITHUB_SHA} -t xinfinorg/xdposchain:${GITHUB_REF#refs/tags/} -f cicd/Dockerfile .
      - name: Push Docker image
        run: docker push xinfinorg/xdposchain:${GITHUB_REF#refs/tags/}

  devnet_build_push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev-upgrade' && !startsWith(github.ref, 'refs/tags/')
    needs: [race, static]
    outputs:
      output1: ${{ steps.docker.outputs.image_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Build and Push Docker images
        id: docker
        run: |
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          image_name=xinfinorg/devnet:dev-upgrade-${git_hash}
          docker pull xinfinorg/devnet:latest
          docker tag xinfinorg/devnet:latest xinfinorg/devnet:previous
          docker rmi xinfinorg/devnet:latest
          docker build --build-arg GIT_COMMIT=${GITHUB_SHA} -t xinfinorg/devnet:latest -f cicd/Dockerfile .
          docker tag xinfinorg/devnet:latest $image_name
          docker push $image_name
          docker push xinfinorg/devnet:latest
          docker push xinfinorg/devnet:previous
          echo "image_name=$image_name"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

  k8_update_start_script:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev-upgrade' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.19.11"
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Fetch start scripts from XinFin-Node
        run: |
          set -euo pipefail
          curl -fsSL -o start-devnet.sh  https://raw.githubusercontent.com/XinFinOrg/XinFin-Node/devnet/devnet/start-devnet.sh
          curl -fsSL -o start-apothem.sh https://raw.githubusercontent.com/XinFinOrg/XinFin-Node/master/testnet/start-apothem.sh
          curl -fsSL -o start-node.sh    https://raw.githubusercontent.com/XinFinOrg/XinFin-Node/master/mainnet/start-node.sh
      - name: Apply configmaps
        run: |
          set -euo pipefail
          kubectl create configmap start-devnet-sh --from-file=start-devnet.sh --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap start-apothem-sh --from-file=start-apothem.sh --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap start-node-sh --from-file=start-node.sh --dry-run=client -o yaml | kubectl apply -f -

  devnet_k8_apply:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev-upgrade' && !startsWith(github.ref, 'refs/tags/')
    needs: devnet_build_push
    steps:
      - uses: actions/checkout@v5
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.19.11"
      - name: Apply new image version to Kubernetes deployments
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          masternodes=$(kubectl get deployment -o json | jq -r '.items[] | select(.metadata.name | test("^masternode[0-9]")) | .metadata.name' | sort)
          rpcs=$(kubectl get deployment -o json| jq -r '.items[] | select(.metadata.name | test("rpc")) | "\(.metadata.name)"')
          echo "Masternodes: $masternodes"
          echo "RPCs: $rpcs"

          export git_hash
          echo "Total masternode deployments: $(echo "$masternodes" | wc -l)"

          echo "$masternodes" | xargs -r -P 32 -I {} bash -c '
            name="$1"
            # # Skip masternode1 through masternode25, update the rest.
            # if [[ $name =~ ^masternode[0-9] ]]; then
            #   num=${name#masternode}
            #   num=${num%%-*}
            #   if [[ $num =~ ^[0-9]+$ ]] && (( num >= 1 && num <= 25 )); then
            #     echo "Skipping deployment: $name"
            #     exit 0
            #   fi
            # fi
            echo "Updating deployment: $name"
            kubectl set image "deployment/$name" "$name=xinfinorg/devnet:dev-upgrade-${git_hash}" || true
          ' _ {}

          echo "$rpcs" | xargs -r -P 32 -I {} bash -c '
            name="$1"
            kubectl set image "deployment/$name" "$name=xinfinorg/devnet:dev-upgrade-${git_hash}" || true
          ' _ {}

  devnet_send_notification:
    runs-on: ubuntu-latest
    needs: devnet_k8_apply
    if: github.ref == 'refs/heads/dev-upgrade' && !startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v5
    - name: Send deployment notification
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK_URL }}
        REPO: ${{ github.repository }}
      run: |
        # Extract PR number from merge commit message, e.g. "refactor(core): remove locals #30559 (#2176)"
        # Matches the last (#NNNN) pattern to get your repo's PR, not the upstream reference
        PR_NUMBER=$(git log -1 --format='%s' | grep -oP '\(#\K[0-9]+(?=\))' | tail -1 || true)

        PR_LINE="Commit: <https://github.com/${REPO}/commit/${GITHUB_SHA}|${GITHUB_SHA::7}>"
        if [ -n "$PR_NUMBER" ]; then
          PR_LINE+=$'\nMerged PR: <https://github.com/'"${REPO}"'/pull/'"${PR_NUMBER}"'|#'"${PR_NUMBER}"'>'
        fi

        curl -X POST -H 'Content-type: application/json' \
          --data "$(jq -n \
            --arg pr_line "$PR_LINE" \
            --arg sha "$GITHUB_SHA" \
            '{
              "text": ":rocket: Deployment: devnet",
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": ":rocket: Deployment: devnet"}
                },
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": ("Service: *xdc*\nEnvironment: *devnet*\nVersion: `" + $sha + "`\n" + $pr_line)}
                }
              ]
            }')" \
          "$SLACK_WEBHOOK"